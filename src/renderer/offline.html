<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self';"
  />
  <title>Muse Desktop — Connection Unavailable</title>
  <link rel="stylesheet" href="./offline.css" />
  <script src="./offline.js" defer></script>
</head>
<body>
  <main class="card">
    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 8.82a15 15 0 0 1 20 0" />
        <path d="M5 12.86a10 10 0 0 1 14 0" />
        <path d="M8.5 16.43a5 5 0 0 1 7 0" />
        <path d="M12 20h.01" />
        <path d="M3 3l18 18" />
      </svg>
    </div>
    <h1>Unable to reach Muse</h1>
    <p>
      Muse Desktop couldn't connect right now. Check your internet connection and try again.
    </p>
    <div class="details" id="errorDetails">Loading connection details...</div>
    <div class="actions">
      <button class="btn-primary" id="retryBtn" type="button">Retry Connection</button>
      <button class="btn-secondary" id="browserBtn" type="button">Open in Browser</button>
    </div>
    <p class="hint">Press <strong>Enter</strong> or <strong>R</strong> to retry</p>
  </main>
</body>
</html>
