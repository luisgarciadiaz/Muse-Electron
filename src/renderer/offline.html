<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muse Desktop — Connection Unavailable</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0e14;
      --surface: #141925;
      --border: rgba(148, 163, 184, 0.16);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #4f8cff;
      --accent-hover: #6ba0ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(79, 140, 255, 0.14), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.12), transparent 45%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 36px 32px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }

    .badge {
      width: 60px;
      height: 60px;
      margin: 0 auto 20px;
      border-radius: 16px;
      background: linear-gradient(135deg, #1d2b53, #3b2d7a);
      border: 1px solid rgba(125, 211, 252, 0.28);
      display: grid;
      place-items: center;
    }

    .badge svg {
      width: 30px;
      height: 30px;
      stroke: #93c5fd;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
    }

    p {
      font-size: 0.94rem;
      line-height: 1.55;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .details {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.8rem;
      color: #cbd5e1;
      word-break: break-word;
      margin-bottom: 24px;
      text-align: left;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 140ms ease, transform 100ms ease, border-color 140ms ease;
    }

    button:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: rgba(148, 163, 184, 0.1);
      color: var(--text);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      background: rgba(148, 163, 184, 0.18);
    }

    .hint {
      margin-top: 20px;
      margin-bottom: 0;
      font-size: 0.78rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 8.82a15 15 0 0 1 20 0" />
        <path d="M5 12.86a10 10 0 0 1 14 0" />
        <path d="M8.5 16.43a5 5 0 0 1 7 0" />
        <path d="M12 20h.01" />
        <path d="M3 3l18 18" />
      </svg>
    </div>
    <h1>Unable to reach Muse</h1>
    <p>
      Muse Desktop couldn't connect right now. Check your internet connection and try again.
    </p>
    <div class="details" id="errorDetails">Loading connection details...</div>
    <div class="actions">
      <button class="btn-primary" id="retryBtn" type="button">Retry Connection</button>
      <button class="btn-secondary" id="browserBtn" type="button">Open in Browser</button>
    </div>
    <p class="hint">Press <strong>Enter</strong> or <strong>R</strong> to retry</p>
  </main>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const targetUrl = params.get('url') || 'https://muse.ai';
      const errorMsg = params.get('error') || 'Network unavailable';

      const detailsEl = document.getElementById('errorDetails');
      detailsEl.textContent = targetUrl + '\n' + errorMsg;

      const retryBtn = document.getElementById('retryBtn');
      const browserBtn = document.getElementById('browserBtn');

      function retry() {
        if (window.museDesktop && typeof window.museDesktop.retryConnection === 'function') {
          window.museDesktop.retryConnection();
        } else {
          window.location.href = targetUrl;
        }
      }

      retryBtn.addEventListener('click', retry);
      browserBtn.addEventListener('click', function () {
        if (window.museDesktop && typeof window.museDesktop.openInBrowser === 'function') {
          window.museDesktop.openInBrowser(targetUrl);
        }
      });

      window.addEventListener('online', retry);
      window.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' || event.key === 'r' || event.key === 'R') {
          retry();
        }
      });
    })();
  </script>
</body>
</html>
